var KEY = "ru_tutor_v1";
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      dark: S.dark, offline: S.offline, score: S.score,
      known: S.known, voice: S.voice ? S.voice.name : null
    }));
  } catch (e) {}
}
function load() {
  try {
    var d = JSON.parse(localStorage.getItem(KEY) || "{}");
    if (d.dark != null) S.dark = d.dark;
    if (d.offline != null) S.offline = d.offline;

    if (d.known) S.known = d.known;
    return d.voice || null;
  } catch (e) { return null; }
}

var RU = "ru-RU";
var ACTIVE = null;
var norm = function (s) { return (s || "").replace("_", "-").toLowerCase(); };
var isRu = function (v) { return norm(v.lang).indexOf("ru") === 0; };

function score(v, off) {
  var n = (v.name || "").toLowerCase(), s = 0;
  if (off) { if (v.localService) s += 100; else s -= 500; }
  else { if (!v.localService) s += 45; }
  if (n.indexOf("natural") >= 0 || n.indexOf("neural") >= 0) s += 40;
  if (n.indexOf("google") >= 0) s += 30;
  if (n.indexOf("microsoft") >= 0) s += 28;
  if (/svetlana|milena|dariya|yuri|pavel|dmitr|irina|katya/.test(n)) s += 12;
  if (n.indexOf("compact") >= 0) s -= 25;
  if (n.indexOf("espeak") >= 0) s -= 60;
  return s;
}

/* ILDIZ SABAB: .voice berilmasa brauzer O'ZI default tanlaydi —
   amalda ingliz motori kirillni fonetik o'qiydi. Shuning uchun .voice SHART. */
function speak(text, rate) {
  var sy = window.speechSynthesis;
  if (!sy || !text) return;
  sy.cancel();
  var u = new SpeechSynthesisUtterance(String(text));
  u.lang = RU;
  if (ACTIVE) u.voice = ACTIVE;      // ◄── ASOSIY TUZATISH
  u.rate = rate || 0.9;
  sy.speak(u);
}

function usable() {
  return S.voices.filter(function (v) { return S.offline ? v.localService : true; });
}

function autoPick() {
  var list = usable();
  if (!list.length) { ACTIVE = null; S.voice = null; return; }
  var wanted = savedVoiceName;
  var found = wanted && list.filter(function (v) { return v.name === wanted; })[0];
  var best = found || list.slice().sort(function (a, b) {
    return score(b, S.offline) - score(a, S.offline);
  })[0];
  S.voice = best; ACTIVE = best;
}

var savedVoiceName = null;

function initVoices() {
  var sy = window.speechSynthesis;
  if (!sy) { render(); return; }
  var scan = function () {
    var ru = sy.getVoices().filter(isRu);
    if (!ru.length) return false;
    S.voices = ru; autoPick(); render();
    return true;
  };
  if (scan()) return;
  sy.onvoiceschanged = scan;
  setTimeout(function () {
    if (!S.voices.length) { S.voices = sy.getVoices().filter(isRu); autoPick(); render(); }
  }, 1800);
}

var T = function () { return S.dark ? THEME.dark : THEME.light; };
var el = function (tag, attr, kids) {
  var e = document.createElement(tag), k;
  for (k in (attr || {})) {
    if (k === "style") { for (var p in attr.style) e.style[p] = attr.style[p]; }
    else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2).toLowerCase(), attr[k]);
    else if (k === "html") e.innerHTML = attr[k];
    else if (k === "text") e.textContent = attr[k];
    else e.setAttribute(k, attr[k]);
  }
  (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
  return e;
};
var mono = "ui-monospace,SFMono-Regular,Menlo,monospace";

  if (!S.flip) {

      lineHeight: "1.2", color: t.ink }, text: c.ru }));
    in2.appendChild(el("p", { style: { fontFamily: mono, fontSize: "10px",
      letterSpacing: ".18em", textTransform: "uppercase", color: t.faint, marginTop: "18px" },
      text: "Space — ochish" }));
  } else {
    in2.appendChild(el("p", { style: { fontFamily: mono, fontSize: "17px", color: t.red },
      text: c.tr }));
    in2.appendChild(el("p", { style: { fontSize: "23px", color: t.ink, marginTop: "12px" },
      text: c.uz }));
    if (c.note) in2.appendChild(el("p", { style: { fontSize: "12px", color: t.faint,
      marginTop: "16px" }, text: c.note }));
  }
  card.appendChild(in2);
  box.appendChild(card);

  var nav = el("div", { style: { display: "flex", justifyContent: "space-between",
    alignItems: "center", marginTop: "12px" } });
  nav.appendChild(el("button", { style: { background: "none", border: "none",
    fontFamily: mono, fontSize: "11px", letterSpacing: ".12em", textTransform: "uppercase",
    color: t.dim, padding: "4px 8px" },
    onclick: function () { S.cardI = (S.cardI - 1 + cards.length) % cards.length;
      S.flip = false; render(); }, text: "← Oldingi" }));

  var mid = el("div", { style: { display: "flex", alignItems: "center", gap: "10px" } });
  mid.appendChild(snd(c.ru, false)); mid.appendChild(snd(c.ru, true));
  mid.appendChild(el("span", { style: { fontFamily: mono, fontSize: "11px", color: t.faint },
    text: pad(S.cardI + 1, 2) + " / " + pad(cards.length, 2) }));
  var kn = !!S.known[c.ru];
  mid.appendChild(tag(kn ? "✓ Bildim" : "Bildim", kn, function () {
    if (!S.known[c.ru]) { S.known[c.ru] = 1; addScore(1); save(); render(); }
  }));
  nav.appendChild(mid);

  nav.appendChild(el("button", { style: { background: "none", border: "none",
    fontFamily: mono, fontSize: "11px", letterSpacing: ".12em", textTransform: "uppercase",
    color: t.dim, padding: "4px 8px" },
    onclick: function () { S.cardI = (S.cardI + 1) % cards.length; S.flip = false; render(); },
    text: "Keyingi →" }));
  box.appendChild(nav);

  var learned = cards.filter(function (x) { return S.known[x.ru]; }).length;
  var bg = el("div", { style: { marginTop: "14px", height: "3px", background: t.hair } });
  bg.appendChild(el("div", { style: { height: "100%", background: t.red,
    width: (learned / cards.length * 100) + "%", transition: "width .3s" } }));
  box.appendChild(bg);

  box.appendChild(el("p", { style: { marginTop: "12px", fontSize: "10px", color: t.faint },
    html: "<kbd>←</kbd> <kbd>→</kbd> karta · <kbd>Space</kbd> aylantir · <kbd>Enter</kbd> bildim · <kbd>A</kbd> eshit" }));
  return box;
}

/* ══════════════════════════════════════════════════════════════
   SUHBAT — offline stsenariy (API yo'q)
   ══════════════════════════════════════════════════════════════ */
function tabTalk() {
  var t = T(), box = el("div", { style: { padding: "20px 0" } });
  var set = OFFLINE_TALK[S.talk];
  if (S.talkI >= set.length) S.talkI = 0;
  var d = set[S.talkI];

  var bar = el("div", { style: { display: "flex", gap: "1px", marginBottom: "14px", flexWrap: "wrap" } });
  Object.keys(OFFLINE_TALK).forEach(function (n) {
    bar.appendChild(tag(n, S.talk === n, function () {
      S.talk = n; S.talkI = 0; S.talkShow = false; render();
    }));
  });
  box.appendChild(bar);

  box.appendChild(note("Offline suhbat",
    "Savolni eshit → o'zing javob ber (ovoz chiqarib!) → tekshir. " +
    "Internet bo'lsa, «Suhbat» tabida jonli Claude bilan gaplashasan."));

  // Savol
  var q = el("div", { style: { marginTop: "14px", borderLeft: "2px solid " + t.red,
    paddingLeft: "14px" } });
  var qh = el("div", { style: { display: "flex", alignItems: "flex-start", gap: "6px" } });
  qh.appendChild(el("p", { style: { flex: "1", fontFamily: serif, fontSize: "22px",
    lineHeight: "1.35", color: t.ink }, text: d.q }));
  qh.appendChild(snd(d.q, false)); qh.appendChild(snd(d.q, true));
  q.appendChild(qh);
  q.appendChild(el("p", { style: { fontFamily: mono, fontSize: "12.5px", color: t.red,
    marginTop: "6px" }, text: d.qTr }));
  q.appendChild(el("p", { style: { fontSize: "13.5px", color: t.dim, marginTop: "6px" },
    text: d.qUz }));
  box.appendChild(q);

  // Javob
  if (S.talkShow) {
    var a = el("div", { style: { marginTop: "16px", background: t.soft,
      borderLeft: "2px solid " + t.line, padding: "12px 14px" } });
    a.appendChild(el("p", { style: { fontFamily: mono, fontSize: "9px",
      letterSpacing: ".18em", textTransform: "uppercase", color: t.faint,
      marginBottom: "8px" }, text: "Mumkin javob" }));
    var ah = el("div", { style: { display: "flex", alignItems: "flex-start", gap: "6px" } });
    ah.appendChild(el("p", { style: { flex: "1", fontFamily: serif, fontSize: "20px",
      color: t.ink }, text: d.a }));
    ah.appendChild(snd(d.a, false)); ah.appendChild(snd(d.a, true));
    a.appendChild(ah);
    a.appendChild(el("p", { style: { fontFamily: mono, fontSize: "12px", color: t.red,
      marginTop: "6px" }, text: d.aTr }));
    a.appendChild(el("p", { style: { fontSize: "13px", color: t.dim, marginTop: "6px" },
      text: d.aUz }));
    box.appendChild(a);
  } else {
    var btn = el("button", { style: { width: "100%", marginTop: "16px", padding: "12px 0",
      background: "transparent", border: "1px solid " + t.line, color: t.dim,
      fontSize: "11px", letterSpacing: ".14em", textTransform: "uppercase" },
      onclick: function () { S.talkShow = true; addScore(1); render(); },
      text: "Javobni ko'rsat  ·  Space" });
    box.appendChild(btn);
  }

  var nav = el("div", { style: { display: "flex", justifyContent: "space-between",
    alignItems: "center", marginTop: "14px" } });
  nav.appendChild(el("button", { style: { background: "none", border: "none",
    fontFamily: mono, fontSize: "11px", letterSpacing: ".12em", textTransform: "uppercase",
    color: t.dim, padding: "4px 8px" },
    onclick: function () { S.talkI = (S.talkI - 1 + set.length) % set.length;
      S.talkShow = false; render(); }, text: "← Oldingi" }));
  nav.appendChild(el("span", { style: { fontFamily: mono, fontSize: "11px", color: t.faint },
    text: pad(S.talkI + 1, 2) + " / " + pad(set.length, 2) }));
  nav.appendChild(el("button", { style: { background: "none", border: "none",
    fontFamily: mono, fontSize: "11px", letterSpacing: ".12em", textTransform: "uppercase",
    color: t.dim, padding: "4px 8px" },
    onclick: function () { S.talkI = (S.talkI + 1) % set.length;
      S.talkShow = false; render(); }, text: "Keyingi →" }));
  box.appendChild(nav);
  return box;
}

/* ══════════════════════════════════════════════════════════════
   GRAMMATIKA
   ══════════════════════════════════════════════════════════════ */
function tabGram() {
  var t = T(), box = el("div", { style: { padding: "20px 0" } });
  GRAMMAR.forEach(function (g, i) {
    var sec = el("div", { style: { marginBottom: i === GRAMMAR.length - 1 ? "0" : "22px" } });
    sec.appendChild(el("h3", { style: { fontFamily: serif, fontSize: "18px", color: t.ink,
      paddingBottom: "8px", borderBottom: "2px solid " + t.ink, marginBottom: "10px" },
      text: g.t }));
    g.b.forEach(function (line) {
      var row = el("div", { style: { display: "flex", gap: "8px", padding: "5px 0" } });
      row.appendChild(el("span", { style: { color: t.red, fontSize: "13px", flexShrink: "0" },
        text: "—" }));
      row.appendChild(el("span", { style: { fontSize: "13.5px", color: t.ink,
        lineHeight: "1.6" }, text: line }));
      sec.appendChild(row);
    });
    box.appendChild(sec);
  });
  return box;
}

/* ══════════════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════════════ */
var TABS = [
  { id: "abc",   label: "Alifbo",     ru: "алфавит" },
  { id: "drill", label: "Talaffuz",   ru: "произн." },
  { id: "voc",   label: "So'zlar",    ru: "слова" },
  { id: "talk",  label: "Suhbat",     ru: "разговор" },
  { id: "gram",  label: "Grammatika", ru: "грамм." }
];

function render() {
  var t = T();
  document.body.style.background = t.bg;
  document.body.style.color = t.ink;

  var root = document.getElementById("root");
  root.innerHTML = "";

  var page = el("div", { style: { maxWidth: "660px", margin: "0 auto", padding: "28px 20px" } });

  /* SARLAVHA */
  var head = el("header", { style: { display: "flex", alignItems: "flex-end",
    justifyContent: "space-between", paddingBottom: "12px",
    borderBottom: "4px solid " + t.ink, gap: "12px" } });

  var ttl = el("div");
  ttl.appendChild(el("h1", { style: { fontFamily: serif, fontWeight: "900", fontSize: "36px",
    lineHeight: ".9", letterSpacing: "-.03em", color: t.ink },
    html: "РУССКИЙ<span style='color:" + t.red + "'>.</span>" }));
  ttl.appendChild(el("p", { style: { fontFamily: mono, fontSize: "9.5px",
    letterSpacing: ".22em", textTransform: "uppercase", color: t.faint, marginTop: "7px" },
    text: "Offline · Elementary" }));
  head.appendChild(ttl);

  var right = el("div", { style: { display: "flex", alignItems: "flex-end", gap: "14px" } });
  var sc = el("div", { style: { textAlign: "right" } });
  sc.appendChild(el("p", { id: "score", style: { fontFamily: mono, fontWeight: "700",
    fontSize: "24px", lineHeight: "1", color: t.red }, text: pad(S.score, 3) }));
  sc.appendChild(el("p", { style: { fontFamily: mono, fontSize: "9px", letterSpacing: ".18em",
    textTransform: "uppercase", color: t.faint, marginTop: "4px" }, text: "ball" }));
  right.appendChild(sc);
  right.appendChild(el("button", { title: "Tun / kun (D)",
    style: { width: "36px", height: "36px", border: "1px solid " + t.line,
             background: "transparent", color: t.ink, display: "grid",
             placeItems: "center", fontSize: "13px" },
    onclick: function () { S.dark = !S.dark; save(); render(); },
    text: S.dark ? "☀" : "☾" }));
  head.appendChild(right);
  page.appendChild(head);

  /* OFFLINE TUGMASI */
  var off = el("div", { style: { display: "flex", alignItems: "center",
    justifyContent: "space-between", gap: "8px", marginTop: "12px",
    padding: "9px 12px", border: "1px solid " + (S.offline ? t.red : t.hair),
    background: S.offline ? t.tint : "transparent", flexWrap: "wrap" } });
  var ol = el("div");
  ol.appendChild(el("p", { style: { fontFamily: mono, fontSize: "10px",
    letterSpacing: ".14em", textTransform: "uppercase",
    color: S.offline ? t.red : t.faint },
    text: S.offline ? "◉ Offline rejim yoniq" : "○ Offline rejim o'chiq" }));
  ol.appendChild(el("p", { style: { fontSize: "11px", color: t.faint, marginTop: "3px" },
    text: S.offline
      ? "Faqat qurilmadagi ovozlar. Internet kerak emas."
      : "Bulut ovozlari ham ko'rinadi (tabiiyroq, lekin internet kerak)." }));
  off.appendChild(ol);
  off.appendChild(tag(S.offline ? "O'chir" : "Yoq", S.offline, function () {
    S.offline = !S.offline; autoPick(); save(); render();
  }));
  page.appendChild(off);

  /* OVOZ LAB */
  page.appendChild(voiceLab());

  /* TABLAR */
  var nav = el("nav", { style: { display: "flex", gap: "1px", marginTop: "16px" } });
  TABS.forEach(function (x, k) {
    var on = S.tab === x.id;
    var b = el("button", {
      style: { flex: "1", padding: "10px 2px", transition: "all .12s",
               border: "1px solid " + (on ? t.ink : t.line),
               background: on ? t.ink : "transparent",
               color: on ? t.inv : t.dim },
      onclick: function () { S.tab = x.id; render(); }
    });
    b.appendChild(el("span", { style: { display: "block", fontSize: "12px",
      fontWeight: "500", lineHeight: "1" }, text: x.label }));
    b.appendChild(el("span", { style: { display: "block", fontFamily: mono,
      fontSize: "8px", letterSpacing: ".12em", textTransform: "uppercase",
      opacity: ".55", marginTop: "4px" }, text: (k + 1) + " · " + x.ru }));
    nav.appendChild(b);
  });
  page.appendChild(nav);

  /* KONTENT */
  var main = el("main");
  if (S.tab === "abc") main.appendChild(tabAbc());
  else if (S.tab === "drill") main.appendChild(tabDrill());
  else if (S.tab === "voc") main.appendChild(tabVocab());
  else if (S.tab === "talk") main.appendChild(tabTalk());
  else if (S.tab === "gram") main.appendChild(tabGram());
  page.appendChild(main);

  /* FOOTER */
  var f = el("footer", { style: { marginTop: "24px", paddingTop: "12px",
    borderTop: "1px solid " + t.hair, display: "flex",
    justifyContent: "space-between", alignItems: "center", gap: "8px", flexWrap: "wrap" } });
  f.appendChild(el("p", { style: { fontSize: "10px", color: t.faint },
    html: "<kbd>1</kbd>–<kbd>5</kbd> bo'lim · <kbd>D</kbd> tun/kun · <kbd>←</kbd> <kbd>→</kbd> · <kbd>Space</kbd>" }));
  f.appendChild(el("p", { style: { fontFamily: mono, fontSize: "9.5px",
    letterSpacing: ".1em", textTransform: "uppercase",
    color: S.voice ? t.ok : t.red },
    text: S.voice ? "ovoz ✓" : "ovoz yo'q" }));
  page.appendChild(f);

  root.appendChild(page);
}

/* ── KLAVIATURA ──────────────────────────────────────────────── */
document.addEventListener("keydown", function (e) {
  var tg = e.target.tagName;
  if (tg === "INPUT" || tg === "TEXTAREA") return;
  var k = e.key.toLowerCase();
  var n = parseInt(e.key, 10);

  if (n >= 1 && n <= 5) { S.tab = TABS[n - 1].id; render(); return; }
  if (k === "d") { S.dark = !S.dark; save(); render(); return; }

  if (S.tab === "abc") {
    var L = (S.abcOnly ? ABC.filter(function (a) { return a.hard; }) : ABC);
    if (e.key === "ArrowRight") { e.preventDefault(); S.abcI = (S.abcI + 1) % L.length; render(); speak(L[S.abcI].say, 0.8); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); S.abcI = (S.abcI - 1 + L.length) % L.length; render(); speak(L[S.abcI].say, 0.8); }
    else if (e.key === " ") { e.preventDefault(); speak(L[S.abcI].say, 0.8); }
    else if (k === "s") { e.preventDefault(); speak(L[S.abcI].say, 0.55); }
  }
  else if (S.tab === "voc") {
    var C = DECKS[S.deck];
    if (e.key === "ArrowRight") { e.preventDefault(); S.cardI = (S.cardI + 1) % C.length; S.flip = false; render(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); S.cardI = (S.cardI - 1 + C.length) % C.length; S.flip = false; render(); }
    else if (e.key === " ") { e.preventDefault(); S.flip = !S.flip; render(); }
    else if (e.key === "Enter") { e.preventDefault(); var cc = C[S.cardI];
      if (!S.known[cc.ru]) { S.known[cc.ru] = 1; addScore(1); save(); render(); } }
    else if (k === "a") { e.preventDefault(); speak(C[S.cardI].ru, 0.9); }
    else if (k === "s") { e.preventDefault(); speak(C[S.cardI].ru, 0.55); }
  }
  else if (S.tab === "drill") {
    var N = S.drill === "akanye" ? AKANYE.length : PAIRS.length;
    if (e.key === "ArrowRight") { e.preventDefault(); S.drillI = (S.drillI + 1) % N; S.drillShow = false; render(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); S.drillI = (S.drillI - 1 + N) % N; S.drillShow = false; render(); }
    else if (e.key === " ") { e.preventDefault();
      if (S.drill === "akanye") { S.drillShow = !S.drillShow; render(); }
      else { speak(PAIRS[S.drillI].a, 0.8); } }
  }
  else if (S.tab === "talk") {
    var TK = OFFLINE_TALK[S.talk];
    if (e.key === "ArrowRight") { e.preventDefault(); S.talkI = (S.talkI + 1) % TK.length; S.talkShow = false; render(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); S.talkI = (S.talkI - 1 + TK.length) % TK.length; S.talkShow = false; render(); }
    else if (e.key === " ") { e.preventDefault(); S.talkShow = !S.talkShow; render(); }
    else if (k === "a") { e.preventDefault(); speak(TK[S.talkI].q, 0.9); }
  }
});

/* Tarmoq holati o'zgarsa — ovozni qayta tanlaymiz */
window.addEventListener("offline", function () { S.offline = true; autoPick(); save(); render(); });

/* ── ISHGA TUSHIRISH ─────────────────────────────────────────── */
savedVoiceName = load();
render();
initVoices();

})();

</script>
